<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' data:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="description" content="工贸 ERP 静态界面演示入口。无密码验证，不连接真实 ERP。" />
    <meta name="theme-color" content="#102b3b" />
    <title>进入演示 · 工贸 ERP</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="demo-login-page">
    <a class="skip-link" href="#demo-login-content">跳转到演示入口</a>
    <main class="demo-login-layout" id="demo-login-content">
      <section class="demo-login-intro" aria-label="系统介绍">
        <div class="demo-login-brand">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <strong>工贸 ERP</strong>
        </div>
        <div class="demo-login-message">
          <p>业务协同平台</p>
          <h1><span>让订单、库存与生产</span><span>保持同一节奏。</span></h1>
          <span>面向工贸一体企业的业务管理工作台</span>
        </div>
        <small>当前为演示与验证环境，尚未开放正式投产。</small>
      </section>
      <section class="demo-login-panel" aria-labelledby="demo-login-title">
        <div class="demo-login-card">
          <p class="demo-login-eyebrow">欢迎使用</p>
          <h2 id="demo-login-title">登录工作台</h2>
          <p class="demo-login-description">这是公开的静态界面演示，无需输入租户编码或账号。</p>
          <div class="demo-login-fields" aria-label="演示身份信息，无需填写">
            <div class="demo-login-field"><span>租户编码</span><div>演示租户</div></div>
            <div class="demo-login-field"><span>用户名</span><div>演示访客</div></div>
            <div class="demo-login-field"><span>密码</span><div>无需密码</div></div>
          </div>
          <a class="demo-login-button" href="./app.html#/home">进入演示工作台</a>
          <p class="demo-login-notice">仅供界面体验，不是真实登录。任何人都能直接打开演示工作台；请勿在此使用真实账号信息。</p>
        </div>
      </section>
    </main>
  </body>
</html>
