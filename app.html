<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' data:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="description" content="工贸 ERP 独立界面演示。全部内容为虚构样例，不连接业务系统。" />
    <meta name="theme-color" content="#102b3b" />
    <title>工贸 ERP · 界面演示</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳转到主内容</a>
    <div class="site-shell">
      <aside class="sidebar" id="sidebar" aria-label="业务导航">
        <a class="brand" href="#/home" aria-label="工贸 ERP 演示工作台">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><strong>工贸 ERP</strong><small>业务协同平台 · 界面演示</small></span>
        </a>
        <div class="sidebar-inner">
          <p class="nav-caption">业务导航</p>
          <nav id="nav" aria-label="模块导航"></nav>
        </div>
        <div class="sidebar-note">
          <span class="demo-light" aria-hidden="true"></span><strong>独立演示版</strong>
          <p>只展示虚构数据；不会访问正式 ERP，也不会保存业务操作。</p>
        </div>
      </aside>

      <div class="main-column">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" type="button" aria-label="打开业务导航" aria-controls="sidebar" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>
          <div class="breadcrumb" id="breadcrumb" aria-label="当前位置">工贸 ERP <span>/</span> 工作台</div>
          <div class="topbar-right">
            <span class="topbar-demo">仅供界面体验</span>
            <span class="avatar" aria-label="演示用户">演</span>
          </div>
        </header>
        <main id="main-content" tabindex="-1"></main>
        <footer class="site-footer">工贸 ERP · 独立界面演示版　|　全部数据与公司名称均为虚构　|　<a href="./index.html">返回演示入口</a></footer>
      </div>
    </div>
    <button class="nav-backdrop" id="nav-backdrop" type="button" aria-label="关闭业务导航" hidden></button>
    <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <div><span class="dialog-eyebrow">样例详情</span><h2 id="dialog-title">业务单据</h2></div>
        <button id="close-dialog" type="button" class="icon-close" aria-label="关闭详情">×</button>
      </div>
      <div id="dialog-content"></div>
      <p class="dialog-note">此处仅供查看示例，不会提交、审批或过账。</p>
    </dialog>
    <div class="sr-only" id="status" role="status" aria-live="polite"></div>
  </body>
</html>
