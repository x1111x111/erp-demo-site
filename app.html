<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' data:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="description" content="工贸 ERP 独立界面演示。全部内容为虚构样例，不连接业务系统。" />
    <meta name="theme-color" content="#102b3b" />
    <title>工贸 ERP · 界面演示</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./formal-base.css" />
    <link rel="stylesheet" href="./demo-overrides.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳转到主内容</a>
    <div class="app-layout">
      <aside class="app-sidebar" id="sidebar" aria-label="主导航">
        <a class="brand" href="#/home" aria-label="工贸 ERP 演示工作台">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span><strong>工贸 ERP</strong><small>业务协同平台</small></span>
        </a>
        <p class="nav-caption">业务导航</p>
        <nav class="main-nav" id="nav" aria-label="业务导航"></nav>
        <div class="sidebar-foot">
          <div class="environment-badge"><span class="environment-dot" aria-hidden="true"></span> 演示环境</div>
          <p>正式版页面结构 · 虚构样例数据 · 不提交业务操作。</p>
        </div>
      </aside>

      <div class="app-main">
        <header class="app-header">
          <button class="mobile-menu" id="mobile-menu" type="button" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false">菜单</button>
          <div class="header-location" id="breadcrumb" aria-label="当前位置">工贸 ERP <span>/</span> 工作台</div>
          <div class="header-user">
            <span class="tenant-label">租户 演示</span>
            <span class="user-avatar" aria-hidden="true">演</span>
            <span class="user-name">演示访客</span>
            <a class="header-logout" href="./index.html">退出</a>
          </div>
        </header>
        <main id="main-content" tabindex="-1"></main>
      </div>
    </div>
    <button class="nav-backdrop" id="nav-backdrop" type="button" aria-label="关闭业务导航" hidden></button>
    <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <div><span class="dialog-eyebrow">样例详情</span><h2 id="dialog-title">业务单据</h2></div>
        <button id="close-dialog" type="button" class="icon-close" aria-label="关闭详情">×</button>
      </div>
      <div id="dialog-content"></div>
      <p class="dialog-note">此处仅供查看示例，不会提交、审批或过账。</p>
    </dialog>
    <div class="sr-only" id="status" role="status" aria-live="polite"></div>
  </body>
</html>
